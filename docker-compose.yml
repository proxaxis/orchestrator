name: orchestrator_${USER_ROLE}

services:
  dind:
    image: docker:27-dind
    container_name: orchestrator_dind_${USER_ROLE}
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "${SSH_PORT}:22"
    volumes:
      - dind:/var/lib/docker
      - home:/home/ubuntu
    networks:
      orchestrator_net:
        ipv4_address: ${IPV4_ADDRESS}
    restart: always

  agent:
    image: orchestrator:latest
    container_name: orchestrator_agent_${USER_ROLE}
    depends_on:
      - dind
    network_mode: "service:dind"
    tty: true
    stdin_open: true
    environment:
      DOCKER_HOST: tcp://localhost:2375
      SSH_PUBLIC_KEY: "${SSH_PUBLIC_KEY}"
      GIT_USER_NAME: "${GIT_USER_NAME}"
      GIT_USER_EMAIL: "${GIT_USER_EMAIL}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      HOST_UID: "${HOST_UID}"
      HOST_GID: "${HOST_GID}"
    volumes:
      - home:/home/ubuntu
      - ssh:/etc/ssh
    restart: always

volumes:
  dind:
  home:
  ssh:

networks:
  orchestrator_net:
    name: orchestrator_net_${USER_ROLE}
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET}
          gateway: ${GATEWAY}
